<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fbd7a7"/>
  
  <!-- Decorative Pattern (Simplified Birds) -->
  <g opacity="0.08">
    <pattern id="birds" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M16 7h.01 M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20 M20 7l2 .5-2 .5 M10 18v3 M14 17.75V21 M7 18a6 6 0 0 0 3.84-10.61" 
            stroke="#f76e6e" stroke-width="2" fill="none" transform="scale(1.5)"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#birds)"/>
  </g>

  <!-- Central Circle with Logo -->
  <circle cx="600" cy="220" r="85" fill="#f76e6e" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.1))"/>
  <!-- Original Bird Logo from icon.svg -->
  <g transform="translate(558, 178) scale(3.5)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M16 7h.01"/>
    <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/>
    <path d="m20 7 2 .5-2 .5"/>
    <path d="M10 18v3"/>
    <path d="M14 17.75V21"/>
    <path d="M7 18a6 6 0 0 0 3.84-10.61"/>
  </g>

  <!-- Text Content in Primary Color #f76e6e -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="75" fill="#f76e6e">NuestroNido</text>
  <text x="600" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" fill="#f76e6e">Un hogar más organizado, conectado y en armonía.</text>
  
  <!-- Bottom URL -->
  <text x="600" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#f76e6e" opacity="0.7">nuestronido.vercel.app</text>
</svg>